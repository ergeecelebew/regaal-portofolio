function enhancePortfolioPage(){
 const items=page.querySelectorAll('.page-heading,.hero>div,.hero-card,.stats,.card,.journey article,.contact-panel,.detail-preview,.detail-meta');
 items.forEach(el=>el.classList.add('reveal'));
 if(!('IntersectionObserver' in window)){items.forEach(el=>el.classList.add('is-visible'));return;}
 const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}}),{threshold:.12});
 items.forEach(el=>observer.observe(el));
}
window.addEventListener('scroll',()=>{const el=document.getElementById('progress');if(!el)return;const max=document.documentElement.scrollHeight-innerHeight;el.style.width=(max>0?(scrollY/max)*100:0)+'%'},{passive:true});
const page=document.getElementById('page'),nav=document.getElementById('nav'),indicator=document.getElementById('indicator'),links=[...nav.querySelectorAll('a')];let active='home',dragging=false,pointerId=null;
const slot=()=> (nav.clientWidth-24)/5;
function moveToIndex(i,instant=false){const s=slot();indicator.style.width=s+'px';indicator.style.transform='translateX('+Math.max(0,Math.min(4,i))*s+'px)';if(instant)indicator.style.transition='none';}
function show(id,update=true){if(!pages[id])id='home';active=id;page.innerHTML=pages[id];enhancePortfolioPage();page.classList.remove('page');void page.offsetWidth;page.classList.add('page');links.forEach(a=>a.classList.toggle('active',a.hash==='#'+id));moveToIndex(links.findIndex(a=>a.hash==='#'+id));if(update&&location.hash!=='#'+id)history.pushState({page:id},'', '#'+id);window.scrollTo({top:0,behavior:'instant'});document.getElementById('topbtn').hidden=id==='home';}
function indexFromX(x){const r=nav.getBoundingClientRect();return Math.max(0,Math.min(4,(x-r.left-7)/slot()-.5));}
function chooseAt(x){const idx=Math.round(indexFromX(x));show(links[idx].hash.slice(1));}
nav.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;dragging=true;pointerId=e.pointerId;nav.classList.add('dragging');nav.setPointerCapture(e.pointerId);moveToIndex(indexFromX(e.clientX));},{passive:true});
nav.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==pointerId)return;const i=indexFromX(e.clientX);moveToIndex(i);const near=Math.round(i);links.forEach((a,n)=>a.classList.toggle('active',n===near));});
function finishDrag(e){if(!dragging||e.pointerId!==pointerId)return;dragging=false;nav.classList.remove('dragging');chooseAt(e.clientX);pointerId=null;}
nav.addEventListener('pointerup',finishDrag);nav.addEventListener('pointercancel',e=>{if(dragging){dragging=false;nav.classList.remove('dragging');show(active);pointerId=null;}});
links.forEach(a=>a.addEventListener('click',e=>{e.preventDefault();if(!dragging)show(a.hash.slice(1));}));
page.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute('href').slice(1);if(pages[id]){e.preventDefault();e.stopPropagation();show(id)}});document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a||a.closest('#nav')||a.closest('#page'))return;const id=a.getAttribute('href').slice(1);if(pages[id]){e.preventDefault();show(id)}});window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(pages[id]&&id!==active)show(id,false)});
window.addEventListener('popstate',()=>show(location.hash.slice(1)||'home',false));window.addEventListener('resize',()=>moveToIndex(links.findIndex(a=>a.hash==='#'+active)));
document.getElementById('topbtn').addEventListener('click',()=>show('home'));show(location.hash.slice(1)||'home',false);</script>
